site_name: GBP Scorecard
site_description: Evidence-based Google Business Profile scorecard for local home-service businesses. Find where the public profile may be leaking ready customers.
site_url: https://thatguynef.github.io/gbp-scorecard/
site_author: Radical Red Rocket
repo_url: https://github.com/thatguynef/gbp-scorecard
repo_name: thatguynef/gbp-scorecard
edit_uri: edit/main/docs/
copyright: GBP Scorecard · MIT · maintained alongside Radical Red Rocket

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow

hooks:
  - scripts/mkdocs_github_alerts.py

exclude_docs: |
  README.md

nav:
  - Home: index.md
  - Who it's for: audience.md
  - Run an audit: run-an-audit.md
  - Why this exists: why-this-exists.md
  - Framework: framework.md
  - Scoring: scoring.md
  - Evidence: evidence.md
  - Coverage: coverage-completeness.md
  - Family: scorecard-family.md
  - Guides:
      - Architecture: architecture.md
      - Configuration: configuration.md
      - Structured output: structured-output.md
      - Judgment layer: judgment.md
      - Portable checklist: portable-checklist.md
      - Development: development.md
      - Model evaluation: eval.md
  - Project:
      - Style guide: style-guide.md
      - Privacy: privacy.md
      - Release checklist: release-checklist.md
      - GitHub settings: github-settings.md
      - Contributing: https://github.com/thatguynef/gbp-scorecard/blob/main/CONTRIBUTING.md
      - Security: https://github.com/thatguynef/gbp-scorecard/blob/main/SECURITY.md
      - Changelog: https://github.com/thatguynef/gbp-scorecard/blob/main/CHANGELOG.md
  - Reference:
      - Canonical rubric: rubric.md
      - Fix library: fix-library.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/a11y.js

extra:
  generator: false
  social:
    - icon: material/github
      link: https://github.com/thatguynef/gbp-scorecard
      name: GBP Scorecard on GitHub
    - icon: material/map-search
      link: https://thatguynef.github.io/local-visibility-scorecard/
      name: Local Visibility Scorecard
    - icon: material/storefront
      link: https://thatguynef.github.io/gbp-scorecard/
      name: GBP Scorecard
    - icon: material/web
      link: https://thatguynef.github.io/website-scorecard/
      name: Website Scorecard
