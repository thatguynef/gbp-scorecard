<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title">
  <title id="title">Synthetic Acme Plumbing GBP report showing 68 out of 100 and three labeled findings</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="92%" cy="0%" r="80%">
      <stop offset="0" stop-color="#FF3B3B" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FF3B3B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="820" fill="#0B0B0C"/>
  <rect width="1200" height="820" fill="url(#grid)"/>
  <rect x="36" y="36" width="1128" height="748" rx="18" fill="#141416" stroke="#2A2A2E"/>
  <text x="76" y="90" fill="#FF8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3">SYNTHETIC SAMPLE REPORT</text>
  <text x="76" y="138" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="700">Google Business Profile Scorecard</text>
  <text x="76" y="176" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18">Acme Plumbing (synthetic) · Example County, CA</text>
  <rect x="76" y="208" width="300" height="150" rx="12" fill="#1C1C1F" stroke="#2A2A2E"/>
  <text x="100" y="268" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="68" font-weight="700">68</text>
  <text x="204" y="266" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20">/ 100</text>
  <text x="100" y="306" fill="#F5C766" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2">C · AVERAGE</text>
  <text x="100" y="334" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14">Public profile score</text>
  <g transform="translate(408 208)">
    <text x="0" y="20" fill="#FF8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">THE THREE BIGGEST REVENUE LEAKS</text>
    <rect x="0" y="42" width="680" height="94" rx="10" fill="#1C1C1F" stroke="#2A2A2E"/>
    <text x="20" y="72" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600">No direct booking action on the profile</text>
    <text x="20" y="104" fill="#3FBF7F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">VERIFIED</text>
    <text x="150" y="104" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">A ready customer can call, but cannot book.</text>
    <rect x="0" y="150" width="680" height="94" rx="10" fill="#1C1C1F" stroke="#2A2A2E"/>
    <text x="20" y="180" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600">After-hours demand has no next step</text>
    <text x="20" y="212" fill="#F5C766" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">STRONG SIGNAL</text>
    <text x="180" y="212" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">Hours end at 7pm; no path after that.</text>
    <rect x="0" y="258" width="680" height="94" rx="10" fill="#1C1C1F" stroke="#2A2A2E"/>
    <text x="20" y="288" fill="#F7F7F5" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="19" font-weight="600">Speed-to-lead is unknown</text>
    <text x="20" y="320" fill="#FF8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1">OWNER DATA REQUIRED</text>
    <text x="238" y="320" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">A question for the phone and CRM, not a score penalty.</text>
  </g>
  <g transform="translate(76 500)">
    <text x="0" y="0" fill="#FF8F8F" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">SCORE BREAKDOWN</text>
    <g transform="translate(0 28)">
        <rect width="238" height="58" rx="8" fill="#1C1C1F"/>
        <text x="14" y="23" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Identity &amp; Accuracy</text>
        <text x="14" y="46" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">13 / 15</text>
      </g><g transform="translate(260 28)">
        <rect width="238" height="58" rx="8" fill="#1C1C1F"/>
        <text x="14" y="23" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Relevance &amp; Services</text>
        <text x="14" y="46" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">14 / 18</text>
      </g><g transform="translate(520 28)">
        <rect width="238" height="58" rx="8" fill="#1C1C1F"/>
        <text x="14" y="23" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Conversion &amp; Actionability</text>
        <text x="14" y="46" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">15 / 22</text>
      </g><g transform="translate(780 28)">
        <rect width="238" height="58" rx="8" fill="#1C1C1F"/>
        <text x="14" y="23" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Reputation &amp; Trust</text>
        <text x="14" y="46" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">12 / 20</text>
      </g><g transform="translate(0 102)">
        <rect width="238" height="58" rx="8" fill="#1C1C1F"/>
        <text x="14" y="23" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Content &amp; Freshness</text>
        <text x="14" y="46" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">6 / 10</text>
      </g><g transform="translate(260 102)">
        <rect width="238" height="58" rx="8" fill="#1C1C1F"/>
        <text x="14" y="23" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Handoff &amp; Continuity</text>
        <text x="14" y="46" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">8 / 10</text>
      </g><g transform="translate(520 102)">
        <rect width="238" height="58" rx="8" fill="#1C1C1F"/>
        <text x="14" y="23" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Measurement</text>
        <text x="14" y="46" fill="#F7F7F5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">2 / 5</text>
      </g>
  </g>
  <text x="76" y="752" fill="#A6A6AA" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12">Synthetic example. Not a real business. Public Mode · Evidence first · Owner data separate.</text>

</svg>
